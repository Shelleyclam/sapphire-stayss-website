# One-off check: which hostname does the GoDaddy server's FTP certificate name? (Safe to delete.)
name: FTP server check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Reverse DNS:"; dig +short -x 118.139.178.200 || true
          for h in sg2plzcpnl508259.prod.sin2.secureserver.net sg2plzcpnl508259.prod.sin3.secureserver.net ftp.sapphirestayss.in; do echo "$h -> $(dig +short $h)"; done
          echo "FTP certificate:"
          echo | timeout 20 openssl s_client -starttls ftp -connect 118.139.178.200:21 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName || true
